CONFIG_GPIO=y
CONFIG_PRINTK=y

# Image confirmation after a successful boot
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_REBOOT=y

# MCUmgr SMP server on the console UART: uart_mcumgr owns RX, printk shares TX
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_MCUMGR=y
# An upload chunk arrives as two console lines. With the default of two line
# buffers, a line is dropped whenever one is still in use.
CONFIG_UART_MCUMGR_RX_BUF_COUNT=4
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MAIN_STACK_SIZE=2048
