# Attacker build without the vendor key: imgtool adds a correct hash and no
# signature. The version claims to be newer than anything the vendor shipped.
CONFIG_DEMO_GOT_YOU="forged image, no signature"
CONFIG_DEMO_BLINK_MS=250
CONFIG_DEMO_FACTORY_UNLOCK=n
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="9.9.9+0"
